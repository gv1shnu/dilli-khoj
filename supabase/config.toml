project_id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://treasure-hunt.example.workers.dev"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_dilli_khoj_signup"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.judge-query]
verify_jwt = true
