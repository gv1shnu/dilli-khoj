name: Deploy Supabase (migrations + judge)

# Applies database migrations and deploys the judge Edge Function.
#
# Runs automatically on pushes to `main` that touch supabase/ (migrations, the
# judge function, or config), so backend changes ship without a manual step. It
# also stays available as a manual run (with per-step checkboxes) for reruns or
# ad-hoc deploys. CI (typecheck + migration/gameplay tests) runs on every push
# first, so a broken migration should fail there before it can reach `main`.
#
# Requires these repository secrets:
#   SUPABASE_ACCESS_TOKEN  - personal access token from the Supabase dashboard
#   SUPABASE_DB_PASSWORD   - database password (used by `supabase db push`)
# And this repository variable:
#   SUPABASE_PROJECT_REF   - e.g. your-project-ref
#
# PRECONDITIONS handled manually (never in CI, they are sensitive):
#   - The two judge role passwords are set via psql `\password`.
#   - JUDGE_EXECUTOR_DATABASE_URL / JUDGE_PROGRESS_DATABASE_URL are set as
#     Edge Function secrets (`supabase secrets set`).
# See docs/setup-supabase-google.md.

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      push_migrations:
        description: "Run supabase db push (schema migrations)"
        type: boolean
        default: true
      deploy_function:
        description: "Deploy the judge-query Edge Function"
        type: boolean
        default: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy judge
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # On a push event the workflow_dispatch inputs are empty, so default those
      # to "run"; on a manual dispatch, respect the per-step checkboxes.
      - name: Push migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_migrations }}
        run: supabase db push

      - name: Deploy judge function
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_function }}
        run: supabase functions deploy judge-query --project-ref "$PROJECT_REF"
