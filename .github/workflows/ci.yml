name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser app (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (browser, node and edge function)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  edge-function:
    name: Edge Function judge (Deno runtime resolution)
    runs-on: ubuntu-latest
    # The judge's unit tests are vitest and already run in the `browser` job via
    # `pnpm test`. This job validates that the function resolves and type-checks
    # under the Deno runtime it actually deploys on (npm: specifiers + WASM).
    env:
      FN_CONFIG: supabase/functions/judge-query/deno.json
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the judge under Deno
        run: deno check --config "$FN_CONFIG" supabase/functions/judge-query/index.ts
