name: Deploy web (GitHub Pages)

# Deploys the static game shell to GitHub Pages. The user site's custom domain
# serves it at https://www.vishnugandarapu.in/dilli-khoj/.
# Manual only (Actions tab). Requires Settings -> Pages -> Source: GitHub Actions,
# plus this repository secret:
#   VITE_SUPABASE_PUBLISHABLE_KEY - browser publishable key (sb_publishable_...)
# And this repository variable (public, non-secret):
#   VITE_SUPABASE_URL           - e.g. https://your-project-ref.supabase.co
#
# VITE_ values are inlined at build time, so the build step must see them.
# Never place a Supabase secret/service-role key in a VITE_ variable.

on:
  # Manual only: run from the Actions tab after configuring your own secrets.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Check student assets
        run: pnpm test:assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
