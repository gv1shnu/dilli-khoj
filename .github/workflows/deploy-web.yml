name: Deploy web (Cloudflare)

# Deploys the static game shell to Cloudflare Workers Static Assets.
# Manual only (Actions tab). Requires these repository secrets:
#   CLOUDFLARE_API_TOKEN        - token with "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID       - the Cloudflare account id
#   VITE_SUPABASE_PUBLISHABLE_KEY - browser publishable key (sb_publishable_...)
# And this repository variable (public, non-secret):
#   VITE_SUPABASE_URL           - e.g. https://your-project-ref.supabase.co
#
# VITE_ values are inlined at build time, so the build step must see them.
# Never place a Supabase secret/service-role key in a VITE_ variable.

on:
  # Manual only: run from the Actions tab after configuring your own secrets.
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
